<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4" />
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="20 15" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="5 10" stroke-opacity="0.3" />

  <!-- Core Neon Globe -->
  <g transform="translate(146, 146)" filter="url(#glow)">
    <circle cx="110" cy="110" r="100" fill="url(#globeGrad)" />
    
    <!-- Grid lines -->
    <!-- Latitudes -->
    <path d="M 10,110 Q 110,60 210,110" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <path d="M 10,110 Q 110,160 210,110" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    
    <!-- Longitudes -->
    <path d="M 110,10 Q 60,110 110,210" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <path d="M 110,10 Q 160,110 110,210" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    
    <!-- Ring Crossing -->
    <ellipse cx="110" cy="110" rx="100" ry="25" fill="none" stroke="#60a5fa" stroke-width="4" transform="rotate(-30, 110, 110)" stroke-opacity="0.8" />
  </g>
</svg>
